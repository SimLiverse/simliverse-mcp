[package]
name = "isaacsim-mcp-server"
version = "0.4.1"
title = "Isaac Sim MCP Server"
description = "MCP server extension for Isaac Sim to enable communication with Claude and other AI assistants — headless-compatible"
category = "Robotics"
keywords = ["mcp", "server", "socket", "simulation", "robotics"]

[dependencies]
# Core scene/USD layer — present in headless mode on both 5.1 and 6.x PhysX
"isaacsim.core.api" = {}
"isaacsim.core.prims" = {}
"isaacsim.core.utils" = {}
"isaacsim.storage.native" = {}
# NOTE: isaacsim.gui.components and omni.kit.uiapp are GUI-only and MUST NOT be
# listed here — headless Isaac Sim does not load those extensions and the
# dependency check would fail silently, preventing the socket server from starting.

# Main python module this extension provides, it will be publicly available as "import isaac_sim_mcp_extension".
[[python.module]]
name = "isaac_sim_mcp_extension"

[python.pipapi]

[settings]
server.socket = 8766
server.host = "localhost"
